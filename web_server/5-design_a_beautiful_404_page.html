<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ceci n'est pas une page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .pipe {
            font-size: 120px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 { font-size: 80px; color: #e94560; }
        h2 { font-size: 24px; margin: 20px 0; color: #0f3460; background: #e94560; padding: 10px 20px; border-radius: 5px; }
        p { font-size: 18px; color: #aaa; margin: 10px 0; }
        a { color: #e94560; text-decoration: none; font-size: 16px; margin-top: 30px; display: inline-block; border: 1px solid #e94560; padding: 10px 20px; border-radius: 5px; }
        a:hover { background: #e94560; color: #fff; }
    </style>
</head>
<body>
    <div class="pipe">🎨</div>
    <h1>404</h1>
    <h2>Ceci n'est pas une page</h2>
    <p>This is not a page. This is a painting of a page.</p>
    <p>— René Magritte (probably)</p>
    <a href="/">Take me home</a>
</body>
</html>
